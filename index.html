<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17120F">

    <!-- customer.js will update this from Cafe Settings -->
    <title>Order Now || Your Cafe</title>

    <!-- Favicon will be updated from the cafe logo URL -->
    <link rel="icon" href="data:,">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <link rel="stylesheet" href="/css/customer.css">
</head>

<body>

    <!-- Cafe header -->
    <header id="cafedetails">

        <button
            id="mobilecategorytoggle"
            class="mobile-header-btn"
            type="button"
            aria-label="Open categories"
            aria-controls="Mcatogery"
            aria-expanded="false"
        >
            <i class="fa-solid fa-filter" aria-hidden="true"></i>
        </button>

        <div id="cafenamelogo">

            <div id="cafe-logo">
                <i class="fa-solid fa-mug-hot" aria-hidden="true"></i>
            </div>

            <div id="cafe-name">
                <h1>Loading..</h1>
            </div>

        </div>

        <div id="address">

            <div id="add">
                <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                <p>Cafe address</p>
            </div>

            <div id="phone">
                <i class="fa-solid fa-phone" aria-hidden="true"></i>
                <p>Cafe phone</p>
            </div>

        </div>

        <button
            id="mobilecarttoggle"
            class="mobile-header-btn"
            type="button"
            aria-label="Open cart"
            aria-controls="cart"
            aria-expanded="false"
        >
            <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
        </button>

    </header>


    <!-- Backdrop for mobile category drawer -->
    <button
        id="mobileviewbackdrop"
        type="button"
        aria-label="Close categories"
    ></button>


    <!-- Menu and cart -->
    <main id="menudetails">

        <div id="menucontainer">

            <aside id="Mcatogery" aria-label="Menu categories">

                <h2>
                    <i class="fa-solid fa-filter" aria-hidden="true"></i>
                    Category

                    <button
                        id="mobilecategoryclose"
                        type="button"
                        aria-label="Close categories"
                    >
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </h2>

                <!-- Categories are generated by customer.js -->

            </aside>


            <section id="Mitems" aria-label="Menu items">

                <h2>
                    <i class="fa-solid fa-utensils" aria-hidden="true"></i>
                    Menu Items
                </h2>

                <input
                    type="search"
                    placeholder="Search dishes..."
                    id="searchitem"
                    aria-label="Search dishes"
                >

                <!-- Menu cards are generated by customer.js -->

            </section>


            <section id="cart" aria-label="Your order">

                <h2>
                    <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
                    Your Order

                    <button
                        id="mobilecartback"
                        type="button"
                        aria-label="Back to menu"
                    >
                        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    </button>
                </h2>

                <!-- Cart items and total are generated by customer.js -->

                <p id="gst-note">GST 5% applicable</p>

                <button id="placeorder" type="button" disabled>
                    Place Order
                </button>

            </section>

        </div>

    </main>


    <!-- Mobile CTA -->
    <div class="mobile-orderbar">
        <button id="mobileplaceorder" type="button">
            Place Order
        </button>
    </div>


    <!-- Footer -->
    <footer>

        <div id="cafedet">
           
            <h1>Your Cafe</h1>
        </div>

        <div id="cafesociallinks" aria-label="Social links">
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
            <i class="fa-brands fa-facebook" aria-hidden="true"></i>
        </div>

    </footer>


    <!-- Customer order popup -->
    <div
        id="orderModal"
        class="order-modal"
        aria-hidden="true"
    >

        <div
            class="order-modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="orderModalTitle"
        >

            <div class="order-modal-header">

                <div>
                    <h2 id="orderModalTitle">Complete Your Order</h2>

                    <p
                        id="orderModeDescription"
                        class="order-modal-description"
                    >
                        Enter your details to continue.
                    </p>
                </div>

                <button
                    type="button"
                    id="closeOrderModal"
                    class="close-order-modal"
                    aria-label="Close popup"
                >
                    &times;
                </button>

            </div>


            <form id="customerOrderForm">

                <!-- Customer name -->
                <div class="order-form-field">
                    <label for="customerName">Your Name *</label>

                    <input
                        type="text"
                        id="customerName"
                        name="customerName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>


                <!-- Customer phone -->
                <div class="order-form-field">
                    <label for="customerPhone">Phone Number *</label>

                    <input
                        type="tel"
                        id="customerPhone"
                        name="customerPhone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        inputmode="tel"
                        maxlength="30"
                        required
                    >
                </div>


                <!-- Delivery address: visible only in delivery mode -->
                <div
                    id="customerAddressField"
                    class="order-form-field"
                    hidden
                >

                    <label for="customerAddress">
                        Delivery Address *
                    </label>

                    <textarea
                        id="customerAddress"
                        name="customerAddress"
                        placeholder="Enter your complete delivery address"
                        autocomplete="street-address"
                        rows="3"
                        maxlength="500"
                    ></textarea>

                </div>


                <!-- Optional order notes -->
                <div
                    id="customerNotesField"
                    class="order-form-field"
                >

                    <label for="customerOrderNotes">
                        Order Notes (Optional)
                    </label>

                    <textarea
                        id="customerOrderNotes"
                        name="orderNotes"
                        placeholder="Example: Extra spicy, less sugar, no onion, sauce on the side..."
                        rows="3"
                        maxlength="500"
                        aria-describedby="orderNotesHint"
                    ></textarea>

                    <small id="orderNotesHint">
                        Add any food preferences or special instructions.
                    </small>

                </div>


                <!-- Confirm order -->
                <button
                    type="submit"
                    id="confirmWhatsAppOrder"
                >
                    <i
                        class="fa-brands fa-whatsapp"
                        aria-hidden="true"
                    ></i>

                    Confirm Order on WhatsApp
                </button>

            </form>

        </div>

    </div>


    <!-- Customer website logic -->
    <script type="module" src="/javascript/customer.js"></script>

</body>
</html>
